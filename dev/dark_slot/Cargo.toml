[package]
name = "dark_slot"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# 只改内存，不用 fromsoftware-rs
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Diagnostics_Debug"] }

[profile.release]
panic = "unwind"
lto = true
opt-level = 3
