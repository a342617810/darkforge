# GNU 工具链自带的 dlltool 缺汇编器：用 llvm-tools 里的 llvm-ar 当 llvm-dlltool（复制成 ~/.cargo/tools/dlltool.exe）；
# llvm-dlltool 做的导入库 GNU ld 排不对（部分系统函数落在导入表结束标记后面、加载时不解析），所以链接改用工具链自带的 rust-lld
[target.x86_64-pc-windows-gnu]
linker = "rust-lld"
rustflags = [
  "-C", "dlltool=C:/Users/dxphh/.cargo/tools/dlltool.exe",
  "-C", "linker-flavor=ld.lld",
]
