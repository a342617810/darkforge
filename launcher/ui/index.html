<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>暗黑重铸 启动器</title>
<link rel="stylesheet" href="css/df.css">
</head>
<body>
<!-- 暗黑重铸启动器的网页界面（launcher\webui.ps1 用 WebView2 显示，按钮都转给 gui.ps1 原来的处理）。
     设计基准 1280×720，窗口大小不同时整体等比缩放。布局思路参考 hyp-launcher-ui（MIT，见 LICENSE-launcher-ui-shell.txt）。 -->
<div id="stage">
<div id="app" class="world-normal">

  <!-- 背景：底图（不含烟雾）→ 飘动的烟雾 → 字样 → 上下压暗；和游戏标题封面同样的分层（dev\title_menu\make_launcher_bg.py 导出） -->
  <div class="bg">
    <img class="bg-art" id="bgArt" src="img/bg_normal.jpg" alt="">
    <canvas class="bg-smoke" id="smoke" width="960" height="540"></canvas>
    <img class="bg-top" id="bgTop" src="img/top_normal.png" alt="">
    <div class="bg-shade"></div>
  </div>

  <header class="topbar" data-drag>
    <div class="brand" data-drag><span class="brand-mark"></span><span class="brand-name">暗黑重铸</span><span class="brand-sub">DARKFORGE 启动器</span></div>
    <div class="top-right">
      <span class="badge" id="badge"></span>
      <button class="icon-btn" id="btnTools" data-tip="工具与设置" data-tip-place="bottom">
        <i class="nd hide" id="toolsDot"></i>
        <svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.6 4.9-1.9-.4a6.9 6.9 0 0 1-.6 1.5l1.1 1.6-1.6 1.6-1.6-1.1a6.9 6.9 0 0 1-1.5.6l-.4 1.9h-2.2l-.4-1.9a6.9 6.9 0 0 1-1.5-.6l-1.6 1.1-1.6-1.6 1.1-1.6a6.9 6.9 0 0 1-.6-1.5l-1.9-.4v-2.2l1.9-.4c.1-.5.3-1 .6-1.5L5.9 6.9l1.6-1.6 1.6 1.1c.5-.3 1-.5 1.5-.6l.4-1.9h2.2l.4 1.9c.5.1 1 .3 1.5.6l1.6-1.1 1.6 1.6-1.1 1.6c.3.5.5 1 .6 1.5l1.9.4v2.2Z"/></svg>
      </button>
      <span class="sep"></span>
      <button class="win-btn" data-win="minimize" data-tip="最小化" data-tip-place="bottom"><svg viewBox="0 0 12 12"><rect x="1" y="5.5" width="10" height="1.2"/></svg></button>
      <button class="win-btn close" data-win="close" data-tip="关闭" data-tip-place="bottom"><svg viewBox="0 0 12 12"><path d="M2 2.8 2.8 2 6 5.2 9.2 2l.8.8L6.8 6 10 9.2l-.8.8L6 6.8 2.8 10 2 9.2 5.2 6Z"/></svg></button>
    </div>
  </header>

  <!-- 有新版本时显示在面板上方（宿主后台检查更新的结果，state.update） -->
  <button class="upd-pill hide" id="updPill"><i class="nd"></i><span id="updText"></span><b id="updAct">点击查看并更新</b></button>

  <!-- 左下：信息面板（状态 / 运行日志 / 更新日志） -->
  <section class="panel" id="panel">
    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="status">状态</button>
      <button class="tab" data-tab="log">运行日志</button>
      <button class="tab" data-tab="news">更新日志</button>
      <!-- 导出诊断包（用户 2026-11-16「启动器上找个位置加一下」）：和「工具与设置」→「帮助与排查」里的是同一个 -->
      <button class="link tabs-act" id="btnDiag" data-tool="导出诊断包" data-tip="出问题时点这里：把日志、配置、游戏版本和崩溃记录打成一个 zip 放到桌面，发给帮你排查的人（不含存档）">导出诊断包</button>
    </div>
    <div class="tab-body on" data-body="status">
      <div class="stat" id="stPath"><i class="dot"></i><span class="k">游戏路径</span><span class="v"></span><button class="link" data-tool="游戏路径">修改</button></div>
      <div class="stat" id="stRand"><i class="dot"></i><span class="k">敌人随机</span><span class="v"></span></div>
      <div class="stat" id="stLast"><i class="dot"></i><span class="k">上次启动</span><span class="v"></span></div>
      <div class="stat-tip" id="stTip"></div>
    </div>
    <div class="tab-body" data-body="log">
      <pre class="log" id="log"></pre>
    </div>
    <div class="tab-body" data-body="news">
      <div class="news" id="news"><p class="muted">正在读取更新日志……</p></div>
    </div>
  </section>

  <!-- 右下：启动区 -->
  <section class="cta" id="cta">
    <div class="run hide" id="run">
      <div class="run-line"><span id="runText">正在准备……</span><span class="run-pct" id="runPct"></span></div>
      <div class="bar"><i id="runBar"></i></div>
    </div>
    <div class="mode" id="mode">
      <button class="seg" data-mode="vanilla">无敌人随机</button>
      <button class="seg" data-mode="rand">敌人随机</button>
    </div>
    <button class="btn-primary" id="btnLaunch">
      <span class="disc"><svg viewBox="0 0 16 16"><path d="M4.5 2.5l9 5.5-9 5.5z"/></svg></span>
      <span class="label"><b>一键启动</b><small id="launchSub"></small></span>
    </button>
    <div class="row2">
      <button class="btn-secondary" id="btnRandEnemy"><b>一键重随敌人</b><small id="subRandEnemy"></small></button>
      <button class="btn-secondary" id="btnRandItems"><b>一键重随物品</b><small id="subRandItems"></small></button>
    </div>
  </section>

  <!-- 工具与设置（左边分类，右边各项） -->
  <div class="modal-mask hide" id="mask">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><span id="modalTitle">工具与设置</span><button class="win-btn" id="modalClose" data-tip="关闭"><svg viewBox="0 0 12 12"><path d="M2 2.8 2.8 2 6 5.2 9.2 2l.8.8L6.8 6 10 9.2l-.8.8L6 6.8 2.8 10 2 9.2 5.2 6Z"/></svg></button></div>
      <div class="modal-body">
        <nav class="cats" id="cats"></nav>
        <div class="rows" id="rows"></div>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>
  <div class="tip hide" id="tip"></div>
</div>
</div>
<script src="js/layers.js"></script>
<script src="js/bridge.js"></script>
<script src="js/smoke.js"></script>
<script src="js/df.js"></script>
</body>
</html>
